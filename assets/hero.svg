<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">G-FOLD powered descent optimization schematic</title><desc id="desc">A conceptual altitude and lateral position projection shows a descent path entering a glide-slope corridor toward a target. Beside it are the LCVX transformed variables and constraint groups from the solver.</desc><defs><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#dce5e6"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#287f7b"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f5f7f6"/><rect x="22" y="22" width="1156" height="576" rx="12" fill="url(#grid)" stroke="#d4dddf"/><text x="54" y="66" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#287f7b">POWERED-DESCENT GUIDANCE · LOSSLESS CONVEXIFICATION</text><text x="54" y="99" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#20313b">Trajectory optimization with terminal and path constraints</text><rect x="55" y="128" width="699" height="405" rx="10" fill="#fff" stroke="#c8d5d8"/><path d="M111 477H721M111 477V166" stroke="#425a65" stroke-width="2"/><path d="M111 407H721M111 337H721M111 267H721M111 197H721M231 166V477M351 166V477M471 166V477M591 166V477" stroke="#e5ebec"/><path d="M650 477L400 193M650 477L708 193" fill="#d9eee9" fill-opacity=".68" stroke="#5b9f96" stroke-width="2" stroke-dasharray="7 6"/><text x="520" y="222" font-family="system-ui,sans-serif" font-size="13" fill="#39756f">glide-slope corridor</text><path d="M164 210C240 223 285 254 333 292S420 355 474 385 568 432 650 477" fill="none" stroke="#287f7b" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><circle cx="164" cy="210" r="7" fill="#c9794e" stroke="#fff" stroke-width="3"/><circle cx="650" cy="477" r="8" fill="#c9794e" stroke="#fff" stroke-width="3"/><g transform="translate(422 352) rotate(36)"><path d="M0-23 8 8 0 4-8 8Z" fill="#20313b"/><path d="M-4 7-10 17M4 7 10 17" fill="none" stroke="#c9794e" stroke-width="3" stroke-linecap="round"/></g><text x="142" y="190" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#20313b">initial state</text><text x="604" y="505" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#20313b">target</text><text x="81" y="324" transform="rotate(-90 81 324)" font-family="system-ui,sans-serif" font-size="13" fill="#425a65">altitude r_z</text><text x="390" y="516" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#425a65">lateral position r_x (projection)</text><text x="127" y="498" font-family="system-ui,sans-serif" font-size="11" fill="#7c8c91">Illustrative geometry; not a solver output.</text><rect x="782" y="128" width="362" height="190" rx="12" fill="#fff" stroke="#c8d5d8"/><text x="808" y="162" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#536b79">TRANSFORMED VARIABLES</text><text x="808" y="204" font-family="Georgia,serif" font-size="23" fill="#20313b">u = T / m</text><text x="808" y="237" font-family="Georgia,serif" font-size="23" fill="#20313b">ζ = ln(m)</text><text x="808" y="270" font-family="Georgia,serif" font-size="23" fill="#20313b">σ = Γ / m</text><text x="808" y="296" font-family="system-ui,sans-serif" font-size="12" fill="#657980">acceleration · log mass · thrust slack</text><rect x="782" y="337" width="362" height="196" rx="12" fill="#e6f0ed" stroke="#8eb7ad"/><text x="808" y="371" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#287f7b">SOLVER STRUCTURE</text><circle cx="812" cy="411" r="4" fill="#287f7b"/><text x="828" y="416" font-family="system-ui,sans-serif" font-size="14" fill="#20313b">glide-slope and thrust limits</text><circle cx="812" cy="449" r="4" fill="#287f7b"/><text x="828" y="454" font-family="system-ui,sans-serif" font-size="14" fill="#20313b">velocity and terminal conditions</text><circle cx="812" cy="487" r="4" fill="#287f7b"/><text x="828" y="492" font-family="system-ui,sans-serif" font-size="14" fill="#20313b">P3 landing error → P4 fuel objective</text><text x="54" y="570" font-family="system-ui,sans-serif" font-size="12" fill="#657980">Conceptual 2D view of the repository’s three-dimensional powered-descent model; no numeric solution shown.</text></svg>
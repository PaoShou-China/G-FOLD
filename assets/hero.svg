ation · fuel-aware guidance · interactive visualization</text><text x="1000" y="548" font-size="14" letter-spacing="2" fill="#b9d3dc">LANDING TARGET</text><text x="761" y="292" font-size="14" letter-spacing="2" fill="#b9d3dc">CONTROLLED TRAJECTORY</text></g></svg>
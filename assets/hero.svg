<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">G-FOLD powered-descent lossless convexification schematic</title>
<desc id="desc">A conceptual altitude-lateral projection shows a trajectory approaching the target inside a glide-slope corridor. Panels summarize transformed variables, P3 then P4 optimization, and trapezoidal position, velocity, and log-mass dynamics used in solver.py. The path is illustrative, not solver output.</desc>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e5ebf1"/></pattern>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#234c78"/></marker>
</defs>
<rect width="1200" height="700" rx="20" fill="#f7f9fc"/><rect x="20" y="20" width="1160" height="660" rx="14" fill="url(#grid)" stroke="#d6dee8"/>
<text x="54" y="64" font-family="system-ui,sans-serif" font-size="13" font-weight="750" letter-spacing="2.1" fill="#345f8e">POWERED-DESCENT GUIDANCE · LOSSLESS CONVEXIFICATION</text>
<text x="54" y="99" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#122b49">Trajectory optimization with path and terminal constraints</text>
<!-- plot -->
<rect x="54" y="128" width="692" height="391" rx="10" fill="#fff" stroke="#cbd6e1"/>
<path d="M105 469H713M105 469V166" stroke="#415a73" stroke-width="1.7"/>
<path d="M105 408H713M105 347H713M105 286H713M105 225H713M226 166V469M347 166V469M468 166V469M589 166V469" stroke="#e8edf2"/>
<!-- glide slope corridor, toward target -->
<path d="M641 469 407 187M641 469 704 187" fill="#e8eff7" stroke="#6685a5" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="506" y="225" font-family="system-ui,sans-serif" font-size="12" fill="#345f8e">glide-slope corridor</text>
<path d="M165 203C231 214 279 248 324 286S412 353 470 385 566 437 641 469" fill="none" stroke="#234c78" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="165" cy="203" r="7" fill="#bb3038" stroke="#fff" stroke-width="2.5"/><circle cx="641" cy="469" r="8" fill="#bb3038" stroke="#fff" stroke-width="2.5"/>
<text x="141" y="185" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#122b49">initial state</text><text x="601" y="499" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#122b49">target r<tspan baseline-shift="sub" font-size="9">f</tspan></text>
<text x="76" y="325" transform="rotate(-90 76 325)" font-family="system-ui,sans-serif" font-size="12" fill="#415a73">altitude r<tspan baseline-shift="sub" font-size="9">z</tspan></text>
<text x="389" y="503" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#415a73">lateral position r<tspan baseline-shift="sub" font-size="9">x</tspan> (2D projection)</text>
<text x="72" y="490" font-family="system-ui,sans-serif" font-size="10" fill="#718195">Illustrative geometry · not a numerical solution</text>
<!-- transform panel -->
<rect x="773" y="128" width="373" height="174" rx="11" fill="#fff" stroke="#cbd6e1"/>
<text x="799" y="160" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.3" fill="#345f8e">LCVX TRANSFORMED VARIABLES</text>
<text x="801" y="199" font-family="Georgia,serif" font-size="22" fill="#122b49">u = T / m</text><text x="801" y="231" font-family="Georgia,serif" font-size="22" fill="#122b49">ζ = ln(m)</text><text x="801" y="263" font-family="Georgia,serif" font-size="22" fill="#122b49">σ = Γ / m</text>
<text x="950" y="199" font-family="system-ui,sans-serif" font-size="12" fill="#64758a">control acceleration</text><text x="950" y="231" font-family="system-ui,sans-serif" font-size="12" fill="#64758a">log mass</text><text x="950" y="263" font-family="system-ui,sans-serif" font-size="12" fill="#64758a">scaled thrust slack</text>
<!-- stages -->
<rect x="773" y="317" width="373" height="202" rx="11" fill="#fff" stroke="#cbd6e1"/>
<text x="799" y="350" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.3" fill="#345f8e">TWO-STAGE SOLVER</text>
<rect x="798" y="369" width="142" height="114" rx="8" fill="#f3f6fa" stroke="#cbd6e1"/>
<text x="869" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#345f8e">P3 · LANDING</text>
<text x="869" y="422" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#122b49">min ||r<tspan baseline-shift="sub" font-size="10">T</tspan>−r<tspan baseline-shift="sub" font-size="10">f</tspan>||</text>
<text x="869" y="453" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64758a">altitude constrained to 0</text>
<path d="M942 426h25" stroke="#234c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="976" y="369" width="145" height="114" rx="8" fill="#fff" stroke="#bb3038" stroke-width="1.4"/>
<text x="1048" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#a92c35">P4 · FUEL</text>
<text x="1048" y="422" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#122b49">max ζ<tspan baseline-shift="sub" font-size="10">T</tspan></text>
<text x="1048" y="453" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64758a">position fixed at P3 point</text>
<!-- dynamics band -->
<rect x="54" y="540" width="1092" height="106" rx="11" fill="#fff" stroke="#cbd6e1"/>
<text x="80" y="569" font-family="system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.2" fill="#a92c35">TRAPEZOIDAL DISCRETIZATION · solver.py</text>
<text x="80" y="605" font-family="Georgia,serif" font-size="16" fill="#122b49">vₖ₊₁ = vₖ + Δt/2 (uₖ + uₖ₊₁ + 2g)</text>
<text x="472" y="605" font-family="Georgia,serif" font-size="16" fill="#122b49">rₖ₊₁ = rₖ + Δt/2 (vₖ + vₖ₊₁)</text>
<text x="834" y="605" font-family="Georgia,serif" font-size="16" fill="#122b49">ζₖ₊₁ = ζₖ − αΔt/2 (σₖ + σₖ₊₁)</text>
<text x="54" y="666" font-family="system-ui,sans-serif" font-size="11" fill="#64758a">Conceptual projection of the repository’s 3D model; path is illustrative and no solver output is shown.</text>
</svg>